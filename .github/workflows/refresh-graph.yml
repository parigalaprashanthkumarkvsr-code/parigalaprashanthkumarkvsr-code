name: Refresh living contribution graph

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install daily dependencies
        run: pip install -r tools/requirements-daily.txt
      - name: Pull contribution data
        run: python tools/pull_contributions.py
      - name: Render graph
        run: python tools/render_graph.py
      - name: Commit refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.json assets/graph.svg
          git diff --cached --quiet || git commit -m "auto: refresh contribution graph [skip ci]"
          git push